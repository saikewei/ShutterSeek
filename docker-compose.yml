services:
  shutterseek:
    # CI supplies an immutable revision tag and the selected registry.
    image: ${IMAGE_REGISTRY:-ghcr.io/saikewei}/shutterseek:${IMAGE_TAG:-latest}
    container_name: shutterseek
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /volume1/Main/Photos:/photos:ro
      - /volume1/Main/Photos/uploads:/photos_uploads
      - /volume1/docker/ShutterSeek/thumbnails:/thumbnails
      - /volume1/docker/ShutterSeek/models:/models_vision:ro
    environment:
      SHUTTERSEEK_DB_USER: ${DB_USER}
      SHUTTERSEEK_DB_PASSWORD: ${DB_PASSWORD}
      SHUTTERSEEK_DB_NAME: ${DB_NAME}
      SHUTTERSEEK_REDIS_HOST: ${REDIS_HOST:-172.18.0.3}
      SHUTTERSEEK_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SHUTTERSEEK_SERVER_MODE: release
      SHUTTERSEEK_THUMBNAILS_DIR: /thumbnails/.thumbnails_1080
      SHUTTERSEEK_UPLOAD_DIR: /photos_uploads
      SHUTTERSEEK_MODELS_DIR: /models_vision
      SHUTTERSEEK_JWT_SECRET: ${JWT_SECRET}
      SHUTTERSEEK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # TLS terminates in the nginx edge container; the app serves plain HTTP.
      SHUTTERSEEK_COOKIE_SECURE: "true"
      # Only the edge network may supply X-Forwarded-* headers.
      SHUTTERSEEK_TRUSTED_PROXIES: ${SHUTTERSEEK_TRUSTED_PROXIES:-172.31.0.0/24}
      # Creation workspace and text embedding sidecar
      SHUTTERSEEK_CREATIONS_ENABLED: ${SHUTTERSEEK_CREATIONS_ENABLED:-false}
      SHUTTERSEEK_AGENT_ADDRESS: agent:50051
      SHUTTERSEEK_CREATIONS_RPC_LISTEN: 0.0.0.0:8081
      SHUTTERSEEK_EMBED_URL: ${SHUTTERSEEK_EMBED_URL:-http://embedding:8000}
      SHUTTERSEEK_EMBED_TOKEN: ${EMBED_TOKEN}
      SHUTTERSEEK_EMBED_TIMEOUT_MS: ${SHUTTERSEEK_EMBED_TIMEOUT_MS:-10000}
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/api/health'
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - default
      - shutterseek-internal
      - shutterseek-proxy

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io/saikewei}/shutterseek-nginx:${IMAGE_TAG:-latest}
    container_name: shutterseek-nginx
    restart: unless-stopped
    ports:
      - "${SHUTTERSEEK_HTTPS_PORT:-8443}:8443"
    environment:
      ACME_DOMAIN: ${SHUTTERSEEK_DOMAIN:-nas.saikewei.tech}
      ACME_EMAIL: ${ACME_EMAIL:-saikewei27@gmail.com}
      ACME_SERVER: ${ACME_SERVER:-letsencrypt}
      ACME_RENEW_INTERVAL: ${ACME_RENEW_INTERVAL:-43200}
      APP_UPSTREAM: "shutterseek:8080"
      Ali_Key: ${ALIYUN_ACCESS_KEY_ID}
      Ali_Secret: ${ALIYUN_ACCESS_KEY_SECRET}
      TZ: Asia/Shanghai
    volumes:
      - ${SHUTTERSEEK_NGINX_DIR:-/volume1/docker/ShutterSeek/nginx}/acme:/acme.sh
      - ${SHUTTERSEEK_NGINX_DIR:-/volume1/docker/ShutterSeek/nginx}/certs:/etc/nginx/certs
      - ${SHUTTERSEEK_NGINX_DIR:-/volume1/docker/ShutterSeek/nginx}/locations:/etc/nginx/extra/locations:ro
      - ${SHUTTERSEEK_NGINX_DIR:-/volume1/docker/ShutterSeek/nginx}/servers:/etc/nginx/extra/servers:ro
    depends_on:
      shutterseek:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/nginx-health || exit 1'
      interval: 15s
      timeout: 5s
      # First start may need to issue a certificate through Aliyun DNS.
      start_period: 120s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shutterseek-proxy

  embedding:
    image: ${IMAGE_REGISTRY:-ghcr.io/saikewei}/shutterseek-embedding:${IMAGE_TAG:-latest}
    container_name: shutterseek-embedding
    restart: unless-stopped
    volumes:
      - /volume1/docker/ShutterSeek/models:/models:ro
    environment:
      MODEL_DIR: /models
      MODEL_FILE: model.onnx
      ORT_THREADS: "3"
      EMBED_TOKEN: ${EMBED_TOKEN}
    mem_limit: 1g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - shutterseek-internal

  agent:
    image: ${IMAGE_REGISTRY:-ghcr.io/saikewei}/shutterseek-agent:${IMAGE_TAG:-latest}
    container_name: shutterseek-agent
    profiles: ["creations"]
    restart: unless-stopped
    environment:
      SHUTTERSEEK_CREATIONS_WORKSPACE_ADDRESS: shutterseek:8081
      SHUTTERSEEK_CREATIONS_MODEL: ${SHUTTERSEEK_CREATIONS_MODEL:-deepseek-flash}
      SHUTTERSEEK_CREATIONS_MODEL_URL: ${SHUTTERSEEK_CREATIONS_MODEL_URL:-https://api.deepseek.com}
      SHUTTERSEEK_CREATIONS_MODEL_KEY: ${SHUTTERSEEK_CREATIONS_MODEL_KEY:-}
    depends_on:
      shutterseek:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "health_check.py"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    mem_limit: 1536m
    cpus: "2.0"
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - shutterseek-internal
      - agent-egress

networks:
  default:
    name: postgres-main_default
    external: true
  shutterseek-internal:
    internal: true
  shutterseek-proxy:
    name: shutterseek-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
  agent-egress:
    driver: bridge
