services:
  shutterseek:
    image: ghcr.io/saikewei/shutterseek:latest
    container_name: shutterseek
    restart: unless-stopped
    ports:
      - "${SHUTTERSEEK_TLS_PORT:-8443}:${SHUTTERSEEK_TLS_PORT:-8443}"
    volumes:
      - /volume1/Main/Photos:/photos:ro
      - /volume1/Main/Photos/uploads:/photos_uploads
      - /volume1/docker/ShutterSeek/thumbnails:/thumbnails
      - ${SHUTTERSEEK_CERT_DIR:-/volume1/docker/ShutterSeek/certs}:/certs
      - /volume1/docker/ShutterSeek/models:/models_vision:ro
    environment:
      SHUTTERSEEK_DB_USER: ${DB_USER}
      SHUTTERSEEK_DB_PASSWORD: ${DB_PASSWORD}
      SHUTTERSEEK_DB_NAME: ${DB_NAME}
      SHUTTERSEEK_REDIS_HOST: ${REDIS_HOST:-172.18.0.3}
      SHUTTERSEEK_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SHUTTERSEEK_SERVER_MODE: release
      SHUTTERSEEK_THUMBNAILS_DIR: /thumbnails/.thumbnails_1080
      SHUTTERSEEK_UPLOAD_DIR: /photos_uploads
      SHUTTERSEEK_MODELS_DIR: /models_vision
      SHUTTERSEEK_JWT_SECRET: ${JWT_SECRET}
      SHUTTERSEEK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # HTTPS (optional) — Let's Encrypt DNS-01 via Alibaba Cloud DNS
      SHUTTERSEEK_TLS_ENABLED: ${SHUTTERSEEK_TLS_ENABLED:-false}
      SHUTTERSEEK_TLS_DOMAIN: ${SHUTTERSEEK_TLS_DOMAIN:-}
      SHUTTERSEEK_TLS_PORT: ${SHUTTERSEEK_TLS_PORT:-8443}
      SHUTTERSEEK_CERT_DIR: /certs
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      # 文字检索（embedding sidecar）
      SHUTTERSEEK_EMBED_URL: ${SHUTTERSEEK_EMBED_URL:-http://embedding:8000}
      SHUTTERSEEK_EMBED_TOKEN: ${EMBED_TOKEN}
      SHUTTERSEEK_EMBED_TIMEOUT_MS: ${SHUTTERSEEK_EMBED_TIMEOUT_MS:-10000}
    networks:
      - default
      - shutterseek-internal

  embedding:
    image: ghcr.io/saikewei/shutterseek-embedding:latest
    container_name: shutterseek-embedding
    restart: unless-stopped
    volumes:
      - /volume1/docker/ShutterSeek/models:/models:ro
    environment:
      MODEL_DIR: /models
      MODEL_FILE: model.onnx
      ORT_THREADS: "3"
      EMBED_TOKEN: ${EMBED_TOKEN}
    mem_limit: 1g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - shutterseek-internal

networks:
  default:
    name: postgres-main_default
    external: true
  shutterseek-internal:
    internal: true
