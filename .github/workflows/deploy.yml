name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shutterseek

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 0
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: go test -count=1 ./cmd/... ./internal/... 2>&1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push embedding image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/shutterseek-embedding:latest \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/shutterseek-embedding:${{ github.sha }} \
            -f embed/Dockerfile \
            embed
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/shutterseek-embedding:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/shutterseek-embedding:${{ github.sha }}

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Deploy to NAS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          # NAS→GHCR 实测只有 ~0.5MB/s，30m 曾在拉取 442MB 的 embedding 镜像时
          # 超时失败（run #43）。依赖已锁版本，正常情况下拉取会退化为 manifest 检查；
          # 这里留 60m 作为安全网。
          command_timeout: 60m
          script: |
            cd /volume1/docker/ShutterSeek
            docker compose pull
            docker compose up -d
