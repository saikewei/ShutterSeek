name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shutterseek

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # 阿里云 ACR（可选）：配了这 4 个 Secret 才会额外推一份到国内仓库，
      # NAS 侧再从 ACR 拉（GHCR 从国内实测只有 ~0.04MB/s）。
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      EMBEDDING_IMAGE: ${{ github.repository_owner }}/shutterseek-embedding
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: go test -count=1 ./cmd/... ./internal/... 2>&1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 两个镜像各自用独立的 gha 缓存 scope；mode=max 连中间层（前端构建、go 依赖）一起缓存。
      # load: true 让镜像同时落到本地 daemon，后面推 ACR 那步沿用 docker tag/push 的既有路径。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push embedding image
        uses: docker/build-push-action@v6
        with:
          context: embed
          file: embed/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.EMBEDDING_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.EMBEDDING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=embed
          cache-to: type=gha,mode=max,scope=embed

      # ── 可选：同步到阿里云 ACR（国内拉取快）──────────────────────────
      # 未配置 ACR_* Secret 时这几步自动跳过，行为与之前完全一致。
      # 诊断步骤只输出长度与 sha256 前缀（不可逆），用于定位是哪个字段配错。
      - name: Diagnose ACR inputs
        if: env.ACR_USERNAME != '' && env.ACR_REGISTRY != ''
        run: |
          fp() { printf '%s' "$1" | sha256sum | cut -c1-12; }
          echo "ACR_REGISTRY  len=${#ACR_REGISTRY} sha256=$(fp "$ACR_REGISTRY")"
          echo "ACR_NAMESPACE len=${#ACR_NAMESPACE} sha256=$(fp "$ACR_NAMESPACE")"
          echo "ACR_USERNAME  len=${#ACR_USERNAME} sha256=$(fp "$ACR_USERNAME")"
          echo "ACR_PASSWORD  len=${#ACR_PASSWORD} sha256=$(fp "$ACR_PASSWORD")"
          echo "GET /v2/ -> $(curl -sS -o /dev/null -w '%{http_code}' "https://${ACR_REGISTRY}/v2/" 2>&1 || echo connect-failed)"

      - name: Log in to ACR
        if: env.ACR_USERNAME != '' && env.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Push to ACR
        if: env.ACR_USERNAME != '' && env.ACR_REGISTRY != ''
        run: |
          set -e
          # 只推 latest：ACR 个人版不支持自动清理旧版本，推 sha tag 会每次多存一份
          # （两个镜像约 670MB）。历史版本仍保留在 GHCR 里，需要回滚时从那边取。
          ACR_PREFIX="${ACR_REGISTRY}/${ACR_NAMESPACE}"
          for img in shutterseek shutterseek-embedding; do
            docker tag "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${img}:latest" "${ACR_PREFIX}/${img}:latest"
            docker push "${ACR_PREFIX}/${img}:latest"
          done

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Deploy to NAS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          # ACR_* 透传到 NAS，脚本里按需登录私有仓库
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          # NAS→GHCR 实测只有 ~0.5MB/s，30m 曾在拉取 442MB 的 embedding 镜像时
          # 超时失败（run #43）。依赖已锁版本，正常情况下拉取会退化为 manifest 检查；
          # 这里留 60m 作为安全网。切到国内 ACR 后这一步通常只要几秒。
          command_timeout: 60m
          script: |
            set -e
            cd /volume1/docker/ShutterSeek
            # NAS 的 .env 若把 IMAGE_REGISTRY 指向 ACR，需要先登录（私有仓库）
            if [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_USERNAME" ]; then
              echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            fi
            docker compose pull
            docker compose up -d
