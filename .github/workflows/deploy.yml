name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shutterseek-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shutterseek

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      GHCR_PREFIX: ghcr.io/${{ github.repository_owner }}
      DEPLOY_SHA: ${{ github.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release configuration
        run: |
          set -eu
          configured=0
          for variable in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            if [ -n "${!variable}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" != 0 ] && [ "$configured" != 4 ]; then
            echo "Configure all four ACR inputs or leave all unset" >&2
            exit 1
          fi
          docker compose --env-file /dev/null --profile creations config --quiet
          sh -n scripts/deploy.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test Go
        run: go build ./... && go test -count=1 ./cmd/... ./internal/...

      - name: Set up Node for frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Set up Python for Agent tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Agent and browser sandbox
        timeout-minutes: 15
        run: |
          pip install -r agent/requirements.txt
          playwright install --with-deps chromium --only-shell
          python -m unittest discover -s agent/tests -v

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Each image has an independent cache and is tested before publication.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.GHCR_PREFIX }}/shutterseek:latest
            ${{ env.GHCR_PREFIX }}/shutterseek:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build embedding image
        uses: docker/build-push-action@v6
        with:
          context: embed
          file: embed/Dockerfile
          load: true
          tags: |
            ${{ env.GHCR_PREFIX }}/shutterseek-embedding:latest
            ${{ env.GHCR_PREFIX }}/shutterseek-embedding:${{ github.sha }}
          cache-from: type=gha,scope=embed
          cache-to: type=gha,mode=max,scope=embed

      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          load: true
          tags: |
            ${{ env.GHCR_PREFIX }}/shutterseek-agent:latest
            ${{ env.GHCR_PREFIX }}/shutterseek-agent:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Test packaged runtime images
        timeout-minutes: 5
        run: |
          docker run --rm --network none --entrypoint sh "$GHCR_PREFIX/shutterseek:$DEPLOY_SHA" -c 'test -x /app/server && test -s /app/frontend/dist/index.html && command -v cwebp'
          docker run --rm --network none --entrypoint python "$GHCR_PREFIX/shutterseek-embedding:$DEPLOY_SHA" -c 'import onnxruntime; import engine; print("Embedding runtime imports passed")'
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true --memory 1536m --cpus 2 --shm-size 256m --entrypoint python "$GHCR_PREFIX/shutterseek-agent:$DEPLOY_SHA" -c 'import os, asyncio, image_smoke; assert os.geteuid() == 10001; asyncio.run(image_smoke.main())'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested GHCR images
        timeout-minutes: 40
        run: |
          set -eu
          for image in shutterseek shutterseek-embedding shutterseek-agent; do
            timeout 600 docker push "$GHCR_PREFIX/$image:$DEPLOY_SHA"
            timeout 600 docker push "$GHCR_PREFIX/$image:latest"
          done

      - name: Log in to ACR
        if: env.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Publish tested ACR images
        if: env.ACR_REGISTRY != ''
        timeout-minutes: 60
        run: |
          set -eu
          ACR_PREFIX="${ACR_REGISTRY}/${ACR_NAMESPACE}"
          push_with_retry() {
            ref="$1"
            for attempt in 1 2 3; do
              if timeout 600 docker push "$ref"; then return 0; fi
              echo "Image push failed or timed out, attempt $attempt of 3" >&2
              sleep 15
            done
            return 1
          }
          # Revision tags keep all three services on the same tested release.
          for image in shutterseek shutterseek-embedding shutterseek-agent; do
            for tag in "$DEPLOY_SHA" latest; do
              docker tag "$GHCR_PREFIX/$image:$DEPLOY_SHA" "$ACR_PREFIX/$image:$tag"
              push_with_retry "$ACR_PREFIX/$image:$tag"
            done
          done

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Upload frozen deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: "docker-compose.yml,scripts/deploy.sh"
          target: "/volume1/docker/ShutterSeek/tmp/releases/${{ github.sha }}"

      - name: Deploy and verify all enabled services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          envs: ACR_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD,GHCR_PREFIX,DEPLOY_SHA
          command_timeout: 60m
          script: |
            set -eu
            if [ -n "$ACR_REGISTRY" ]; then
              printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
              export IMAGE_REGISTRY="$ACR_REGISTRY/$ACR_NAMESPACE"
            else
              export IMAGE_REGISTRY="$GHCR_PREFIX"
            fi
            sh "/volume1/docker/ShutterSeek/tmp/releases/$DEPLOY_SHA/scripts/deploy.sh"
