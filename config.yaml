# ShutterSeek 配置文件
# 密钥通过 SHUTTERSEEK_ 环境变量注入，不在此文件中

server:
  port: 8080
  mode: debug

database:
  host: postgres-main
  port: 5432
  sslmode: disable
  max_connections: 20

redis:
  host: redis
  port: 6379
  db: 2

thumbnail:
  output_dir: /thumbnails/.thumbnails_1080

upload:
  upload_dir: /photos_uploads
  # 重活（exiftool / cwebp）的进程级并发闸门：NAS 只有 4 核且与其他服务共享
  workers: 2
  # 单批最多几个文件、整批最大字节数（超出返回 413）
  batch_max_files: 8
  max_batch_bytes: 536870912

model:
  dir: /models_vision
