user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # ShutterSeek accepts batches up to 512 MiB; leave room for multipart overhead.
    client_max_body_size 600m;
    client_body_timeout 600s;

    # Docker's embedded DNS. Upstream names are resolved per request so an app
    # container can be recreated without restarting the edge container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;

    # Full server blocks for future virtual hosts. See nginx/README.md.
    include /etc/nginx/extra/servers/*.conf;
}
